<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Yükləmə Portalı</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button id="themeToggle" class="theme-toggle" aria-label="Tema dəyiş">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
    </button>

    <canvas id="gravityBg" aria-hidden="true"></canvas>

    <div class="card">
        <h2 class="main-title">Karyera Dəstəyi Agenti</h2>
        <p class="subtitle">CV-nizi yükləyin və uyğunluğunu əldə edin</p>

        <form id="cvForm">
            <div class="form-group">
                <label for="email">E-poçt ünvanınız</label>
                <input type="email" id="email" placeholder="nümunə@mail.com" required>
            </div>

            <div class="form-group">
                <label>CV Faylı (PDF və ya DOCX)</label>
                <div class="file-drop-area" id="dropArea">
                    <span id="dropText">Faylı bura sürükləyin və ya seçmək üçün klikləyin</span>
                    <input type="file" id="cvFile" accept=".pdf, .docx, application/pdf, application/vnd.openxmlformats-officedocument.wordprocessingml.document" required>
                    <span id="fileName"></span>
                </div>
            </div>

            <button type="submit" id="submitBtn">CV-ni Göndər</button>
        </form>

        <div id="statusMessage" class="message"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
