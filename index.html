<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CV Yükləmə Portalı</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%234F46E5'/%3E%3Cstop offset='100%25' stop-color='%2310B981'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='20' fill='url(%23g)'/%3E%3Cpath d='M30 25h40a5 5 0 015 5v40a5 5 0 01-5 5H30a5 5 0 01-5-5V30a5 5 0 015-5z' fill='white' opacity='0.95'/%3E%3Crect x='35' y='35' width='30' height='3' rx='1.5' fill='%234F46E5'/%3E%3Crect x='35' y='43' width='25' height='3' rx='1.5' fill='%236B7280'/%3E%3Crect x='35' y='51' width='28' height='3' rx='1.5' fill='%236B7280'/%3E%3Crect x='35' y='59' width='20' height='3' rx='1.5' fill='%236B7280'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="top-controls">
        <button id="langToggle" class="lang-toggle" aria-label="Dil dəyiş">
            <span class="lang-text">EN</span>
        </button>
        <button id="themeToggle" class="theme-toggle" aria-label="Tema dəyiş">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5"/>
                <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
        </button>
    </div>

    <canvas id="gravityBg" aria-hidden="true"></canvas>

    <div class="card">
        <h2 class="main-title" data-i18n="title">Karyera Dəstəyi Agenti</h2>
        <p class="subtitle" data-i18n="subtitle">CV-nizi yükləyin və uyğunluğunu əldə edin</p>

        <form id="cvForm">
            <div class="form-group">
                <label for="email" data-i18n="emailLabel">E-poçt ünvanınız</label>
                <input type="email" id="email" data-i18n-placeholder="emailPlaceholder" placeholder="nümunə@mail.com" required>
            </div>

            <div class="form-group">
                <label data-i18n="fileLabel">CV Faylı (PDF və ya DOCX)</label>
                <div class="file-drop-area" id="dropArea">
                    <span id="dropText" data-i18n="dropText">Faylı bura sürükləyin və ya seçmək üçün klikləyin</span>
                    <input type="file" id="cvFile" accept=".pdf, .docx, application/pdf, application/vnd.openxmlformats-officedocument.wordprocessingml.document" required>
                    <span id="fileName"></span>
                </div>
            </div>

            <button type="submit" id="submitBtn" data-i18n="submitBtn">CV-ni Göndər</button>
        </form>

        <div id="statusMessage" class="message"></div>
    </div>

    <!-- Chatbot -->
    <button id="chatbotToggle" class="chatbot-toggle" aria-label="Chatbot">
        <svg class="chat-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/>
            <circle cx="8" cy="10" r="1.5"/>
            <circle cx="12" cy="10" r="1.5"/>
            <circle cx="16" cy="10" r="1.5"/>
        </svg>
        <svg class="close-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
        </svg>
    </button>

    <div id="chatbotWindow" class="chatbot-window">
        <div class="chatbot-header">
            <div class="chatbot-title">
                <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                </svg>
                <span data-i18n="chatbotTitle">Karyera Köməkçisi</span>
            </div>
            <button id="chatbotClose" class="chatbot-close" aria-label="Bağla">
                <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                    <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                </svg>
            </button>
        </div>
        <div id="chatMessages" class="chatbot-messages">
            <div class="chat-message bot">
                <span data-i18n="chatbotWelcome">Salam! Mən sizin karyera köməkçinizəm. CV və iş axtarmağınız barədə suallarınızı soruşa bilərsiniz.</span>
            </div>
        </div>
        <div class="chatbot-input-area">
            <input type="text" id="chatInput" data-i18n-placeholder="chatInputPlaceholder" placeholder="Sualınızı yazın..." autocomplete="off">
            <button id="chatSendBtn" class="chat-send-btn" aria-label="Göndər">
                <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
